description: >-
  Tubular Labs is a social video intelligence and measurement company whose
  platform indexes cross-platform creator, video, and audience data across
  YouTube, Instagram, Facebook, Twitch, and other social video platforms.
  Media companies, brands, and agencies use Tubular for content strategy,
  creator and influencer discovery, competitive and brand-mention tracking,
  category and trend analysis, ad-sales intelligence, and audience insights,
  drawing on a database spanning tens of billions of videos and tens of
  millions of creators. The Tubular API offers programmatic access to that
  cross-platform creator, video, and audience data so teams can integrate
  social video intelligence into their own systems and BI tools (Tableau,
  Domo) alongside CSV report delivery. Tubular Labs was surfaced as a
  portfolio company of Canaan Partners and added to the API Evangelist network.
